services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: authguard-db
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: authguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authguard_network

  # Redis Cache/Session Store
  redis:
    image: redis:7-alpine
    container_name: authguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - authguard_network

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authguard-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://authuser:authpassword@postgres:5432/authguard_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - authguard_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  authguard_network:
    driver: bridge
